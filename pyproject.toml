[project]
name = "recsys-offline-online"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "streamlit>=1.59.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
src = ["src/roo"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
